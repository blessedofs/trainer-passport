<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer Passport</title>
<style>
:root{--bg:#0c1220;--card:#151f33;--soft:#22304a;--text:#f7f9ff;--muted:#9fb0ca;--accent:#ffd34d;--ok:#72e0a5}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0b1020,#101b31);color:var(--text);min-height:100vh}button,input,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 16px 90px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;margin:4px 0 18px}.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#111}.card{background:rgba(21,31,51,.94);border:1px solid #2a3956;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 30px #0004}.hero{text-align:center;padding:30px 18px}.hero h1{font-size:32px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--soft);padding:14px;border-radius:15px}.stat b{display:block;font-size:23px}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:6px 0;background:var(--accent);font-weight:850;color:#161616;cursor:pointer}.btn.secondary{background:#263652;color:white}.btn.ok{background:var(--ok)}label{display:block;color:var(--muted);margin:12px 0 5px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #344764;background:#0f1829;color:white}.row{display:flex;gap:9px}.row>*{flex:1}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#263652;color:#cfe0ff;font-size:13px}.pokemon{font-size:50px}.pokeArt{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 12px #0006)}.pokeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pokeCard{background:var(--soft);border-radius:16px;padding:12px;text-align:center}.pokeCard img{width:100%;height:120px;object-fit:contain}.starterChoice{display:flex;align-items:center;gap:14px}.starterChoice img{width:72px;height:72px;object-fit:contain}@media(min-width:600px){.pokeGrid{grid-template-columns:repeat(3,1fr)}}.listItem{padding:13px 0;border-bottom:1px solid #2a3956}.listItem:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220eF;backdrop-filter:blur(12px);border-top:1px solid #283750;display:flex;justify-content:center}.navInner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.nav button{background:none;color:#9fb0ca;border:0;padding:8px;font-size:12px}.nav button span{display:block;font-size:20px}.hidden{display:none!important}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#eef8ff;color:#102038;padding:12px 18px;border-radius:999px;font-weight:800;z-index:20;box-shadow:0 8px 30px #0008}.choice{border:1px solid #354a6d;background:#18253b;border-radius:14px;padding:13px;margin:7px 0;cursor:pointer}.choice.selected{outline:2px solid var(--accent)}h2{margin:4px 0 10px}h3{margin:15px 0 7px}.tiny{font-size:12px;color:var(--muted)}@media(min-width:650px){.grid.three{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="toast" class="toast hidden"></div><div class="wrap"><div class="brand"><div class="mark">TP</div>Trainer Passport <span class="pill">Prototype 0.3</span></div><main id="app"></main></div><div id="nav" class="nav hidden"><div class="navInner"><button onclick="view='home';render()"><span>📕</span>Passport</button><button onclick="view='pokemon';render()"><span>🐾</span>Pokémon</button><button onclick="view='rewards';render()"><span>🎁</span>Rewards</button><button onclick="view='vendor';render()"><span>🏪</span>Vendor</button></div></div>
<script>
const regions={Kanto:['Bulbasaur','Charmander','Squirtle'],Johto:['Chikorita','Cyndaquil','Totodile'],Hoenn:['Treecko','Torchic','Mudkip'],Sinnoh:['Turtwig','Chimchar','Piplup'],Unova:['Snivy','Tepig','Oshawott'],Kalos:['Chespin','Fennekin','Froakie'],Alola:['Rowlet','Litten','Popplio'],Galar:['Grookey','Scorbunny','Sobble'],Paldea:['Sprigatito','Fuecoco','Quaxly']};
const icons={Bulbasaur:'🌱',Charmander:'🔥',Squirtle:'💧',Chikorita:'🍃',Cyndaquil:'🔥',Totodile:'🌊',Treecko:'🌿',Torchic:'🐥',Mudkip:'💦',Turtwig:'🌱',Chimchar:'🔥',Piplup:'🐧',Snivy:'🌿',Tepig:'🐷',Oshawott:'🦦',Chespin:'🌰',Fennekin:'🦊',Froakie:'🐸',Rowlet:'🦉',Litten:'🐈',Popplio:'🦭',Grookey:'🐒',Scorbunny:'🐇',Sobble:'🦎',Sprigatito:'🐱',Fuecoco:'🐊',Quaxly:'🦆'};
const pokeIds={"Bulbasaur": 1, "Charmander": 4, "Squirtle": 7, "Chikorita": 152, "Cyndaquil": 155, "Totodile": 158, "Treecko": 252, "Torchic": 255, "Mudkip": 258, "Turtwig": 387, "Chimchar": 390, "Piplup": 393, "Snivy": 495, "Tepig": 498, "Oshawott": 501, "Chespin": 650, "Fennekin": 653, "Froakie": 656, "Rowlet": 722, "Litten": 725, "Popplio": 728, "Grookey": 810, "Scorbunny": 813, "Sobble": 816, "Sprigatito": 906, "Fuecoco": 909, "Quaxly": 912, "Pikachu": 25, "Eevee": 133, "Psyduck": 54, "Growlithe": 58, "Gastly": 92, "Cubone": 104, "Scyther": 123, "Snorlax": 143, "Lapras": 131, "Dratini": 147};
function art(p){let id=pokeIds[p];return id?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`:""}
let data=JSON.parse(localStorage.getItem('tp_demo')||'null')||{trainer:null,vendor:{name:'Big Hit Society',available:0,lifetime:0,checkinXP:100,xpPerDollar:10,status:'active',id:'V-0001',instagram:'',website:'',category:'Cards & Collectibles',rewards:[{name:'Free Keychain',cost:500,type:'Permanent'},{name:'$5 Off',cost:1000,type:'Permanent'}]},events:[],pokemon:[],vendorsDiscovered:0,eventsAttended:0,history:[]};let view='home';
function save(){localStorage.setItem('tp_demo',JSON.stringify(data))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function render(){let a=document.getElementById('app'),n=document.getElementById('nav');if(!data.trainer){n.classList.add('hidden');return onboarding(a)}n.classList.remove('hidden');({home,pokemon,rewards,vendor}[view]||home)(a)}
function onboarding(a){a.innerHTML=`<section class="card hero"><div class="pokemon">📕</div><h1>Begin Your Journey</h1><p class="muted">Create your Trainer Passport, choose a region, then choose your first partner.</p><label>Trainer name</label><input id="name" placeholder="Trainer name"><label>Choose region</label><select id="region" onchange="starterOptions()">${Object.keys(regions).map(r=>`<option>${r}</option>`).join('')}</select><div id="starters"></div><button class="btn" onclick="createTrainer()">Create Trainer Passport</button></section>`;starterOptions()}
function starterOptions(){let r=document.getElementById('region')?.value||'Kanto',e=document.getElementById('starters');if(e)e.innerHTML=`<label>Choose your starter</label>`+regions[r].map((p,i)=>`<div class="choice starterChoice ${i===0?'selected':''}" onclick="document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')" data-p="${p}"><img src="${art(p)}" alt="${p}"><div><b>${p}</b><div class="tiny">Choose as your first partner</div></div></div>`).join('')}
function createTrainer(){let name=document.getElementById('name').value.trim();if(!name)return toast('Enter a Trainer name');let region=document.getElementById('region').value,starter=document.querySelector('.choice.selected').dataset.p;data.trainer={name,region,starter,id:'TP-'+String(Math.floor(Math.random()*90000)+10000)};data.pokemon=[starter];save();toast('Trainer Passport activated!');render()}
function home(a){let next=[1,2,3,5,7,10,15,20,30,50].find(x=>x>data.eventsAttended)||'MAX';a.innerHTML=`<section class="card"><span class="pill">${data.trainer.id}</span><h2>${data.trainer.name}'s Passport</h2><div class="row" style="align-items:center"><img class="pokeArt" src="${art(data.trainer.starter)}" alt="${data.trainer.starter}"><div><div class="tiny">ORIGINAL PARTNER</div><h3 style="margin:2px 0">${data.trainer.starter}</h3><div class="muted">${data.trainer.region}</div></div></div><div class="grid"><div class="stat"><b>${data.eventsAttended}</b>Events Attended</div><div class="stat"><b>${data.vendorsDiscovered}</b>Vendors Discovered</div><div class="stat"><b>${data.pokemon.length}</b>Pokémon</div><div class="stat"><b>${data.vendor.available}</b>BHS XP</div></div></section><section class="card"><h3>🐾 Event Discovery</h3><p>Next Pokémon milestone: <b>${next} events</b></p><div class="tiny">Repeat events on different dates count as new Events Attended.</div></section><section class="card"><h3>⭐ Big Hit Society</h3><div class="row"><div class="stat"><b>${data.vendor.available}</b>Available XP</div><div class="stat"><b>${data.vendor.lifetime}</b>Lifetime XP</div></div></section>`}
function pokemon(a){let locked=Math.max(0,12-data.pokemon.length);a.innerHTML=`<section class="card"><h2>🐾 My Pokémon</h2><p class="muted">Your permanent Trainer Passport discoveries.</p><div class="pokeGrid">${data.pokemon.map((p,i)=>`<div class="pokeCard"><img src="${art(p)}" alt="${p}"><b>${p}</b><div class="tiny">${i===0?'Original Partner':'Milestone Discovery'}</div></div>`).join('')}${Array.from({length:Math.min(locked,6)},()=>`<div class="pokeCard" style="display:grid;place-items:center;min-height:166px"><div><div style="font-size:64px;filter:grayscale(1);opacity:.35">❓</div><b>Locked</b><div class="tiny">Keep exploring</div></div></div>`).join('')}</div></section>`}
function rewards(a){a.innerHTML=`<section class="card"><h2>🎁 BHS Rewards</h2><p>Available XP: <b>${data.vendor.available}</b></p>${data.vendor.rewards.map(r=>`<div class="listItem"><b>${r.name}</b><div>${r.cost} XP • ${r.type}</div><div class="tiny">${data.vendor.available>=r.cost?'Reward available':'Need '+(r.cost-data.vendor.available)+' more XP'}</div></div>`).join('')}</section>`}
function vendor(a){
 if(!data.vendorProfile){return vendorSignup(a)}
 let v=data.vendorProfile,active=data.events.find(e=>e.active);
 if(v.status==='pending'){
  a.innerHTML=`<section class="card hero"><div class="pokemon">🏪</div><h2>${v.name}</h2><span class="pill">Pending Verification</span><p class="muted">Your vendor request has been submitted. In the live system an admin reviews the business before checkpoints and XP tools go public.</p><button class="btn secondary" onclick="approveDemoVendor()">Demo: Approve Vendor</button></section>`;return;
 }
 a.innerHTML=`<section class="card"><div class="row"><div><h2>🏪 ${v.name}</h2><span class="pill">${v.id} • Active Vendor</span></div><div style="text-align:right"><button class="btn secondary" onclick="showTrainerQR()">My Trainer QR</button></div></div><p class="muted">${v.category}${v.instagram?' • '+v.instagram:''}</p><h3>Event</h3>${active?`<div class="stat"><b>${active.name}</b>${active.date}</div><button class="btn ok" onclick="checkin()">📡 Simulate Customer Check-In</button>`:`<label>Event name</label><input id="evname" value="Project TCG"><label>Event date</label><input id="evdate" type="date"><button class="btn" onclick="createEvent()">Create & Activate Event</button>`}</section><section class="card"><h3>📡 Permanent Checkpoint</h3><p class="muted">The same permanent vendor identity powers both NFC and QR. The active event is resolved by date/event data.</p><div class="stat"><b>trainerpassport.app/v/${slug(v.name)}</b>Permanent checkpoint URL</div><div class="grid"><button class="btn secondary" onclick="toast('QR download comes with the live backend')">▦ QR Code</button><button class="btn secondary" onclick="toast('Copy this URL into any NFC tag')">📡 NFC Link</button></div></section><section class="card"><h3>⭐ XP Settings</h3><label>Check-in XP</label><input id="cxp" type="number" value="${v.checkinXP}" onchange="data.vendorProfile.checkinXP=+this.value;data.vendor.checkinXP=+this.value;save()"><label>Purchase XP per $1</label><input id="pxp" type="number" value="${v.xpPerDollar}" onchange="data.vendorProfile.xpPerDollar=+this.value;data.vendor.xpPerDollar=+this.value;save()"><h3>🛍️ Test Purchase</h3><div class="row"><input id="purchase" type="number" placeholder="$ amount"><button class="btn" onclick="purchaseXP()">Award XP</button></div></section><section class="card"><h3>🎁 First Rewards</h3>${data.vendor.rewards.map(r=>`<div class="listItem"><b>${r.name}</b><div>${r.cost} XP • ${r.type}</div></div>`).join('')}<button class="btn secondary" onclick="toast('Reward builder is next')">+ Add Reward</button></section>`
}
function vendorSignup(a){a.innerHTML=`<section class="card hero"><div class="pokemon">🏪</div><h1>Become a Trainer Passport Vendor</h1><p class="muted">Create your business profile. After approval, you get a permanent QR/NFC checkpoint, XP settings, rewards and events.</p></section><section class="card"><label>Business name</label><input id="biz" placeholder="Big Hit Society"><label>Instagram <span class="tiny">optional</span></label><input id="ig" placeholder="@yourbusiness"><label>Website <span class="tiny">optional</span></label><input id="site" placeholder="yourwebsite.com"><label>What do you sell?</label><select id="cat"><option>Cards & Collectibles</option><option>Trading Cards</option><option>Accessories</option><option>3D Printed Collectibles</option><option>Other</option></select><button class="btn" onclick="submitVendor()">Create Vendor Profile</button></section><section class="card"><h3>What happens next?</h3><div class="listItem"><b>1. Submit</b><div class="tiny">Your profile enters Pending Verification.</div></div><div class="listItem"><b>2. Approval</b><div class="tiny">Trainer Passport verifies the vendor.</div></div><div class="listItem"><b>3. Checkpoint</b><div class="tiny">Receive one permanent QR/NFC checkpoint identity.</div></div><div class="listItem"><b>4. Go vending</b><div class="tiny">Set XP, rewards, then create or join events.</div></div></section>`}
function submitVendor(){let name=document.getElementById('biz').value.trim();if(!name)return toast('Enter a business name');data.vendorProfile={name,instagram:document.getElementById('ig').value.trim(),website:document.getElementById('site').value.trim(),category:document.getElementById('cat').value,status:'pending',id:'V-'+String(Math.floor(Math.random()*9000)+1000),checkinXP:100,xpPerDollar:10};data.vendor.name=name;save();toast('Vendor request submitted');render()}
function approveDemoVendor(){data.vendorProfile.status='active';data.vendor.checkinXP=data.vendorProfile.checkinXP;data.vendor.xpPerDollar=data.vendorProfile.xpPerDollar;save();toast('Vendor approved for demo');render()}
function slug(x){return x.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function showTrainerQR(){toast('Trainer QR will be generated from the live account')}
function createEvent(){let name=document.getElementById('evname').value.trim(),date=document.getElementById('evdate').value;if(!name||!date)return toast('Add event name and date');data.events.forEach(e=>e.active=false);data.events.push({id:Date.now(),name,date,active:true,checked:false});save();toast('Event activated');render()}
const pool=['Pikachu','Eevee','Psyduck','Growlithe','Gastly','Cubone','Scyther','Snorlax','Lapras','Dratini'];function unlockMilestone(){let milestones=[1,2,3,5,7,10,15,20,30,50];if(!milestones.includes(data.eventsAttended))return;let eligible=pool.filter(p=>!data.pokemon.includes(p));if(!eligible.length)return;let p=eligible[Math.floor(Math.random()*eligible.length)];data.pokemon.push(p);toast('🐾 Pokémon discovered: '+p+'!')}
function checkin(){let e=data.events.find(x=>x.active);if(!e)return toast('No active event');if(e.checked)return toast('Already checked in at this event');e.checked=true;data.vendor.available+=data.vendor.checkinXP;data.vendor.lifetime+=data.vendor.checkinXP;if(data.vendorsDiscovered===0)data.vendorsDiscovered=1;data.eventsAttended++;data.history.push({type:'checkin',event:e.name,date:e.date,xp:data.vendor.checkinXP});unlockMilestone();save();render()}
function purchaseXP(){let amt=+document.getElementById('purchase').value;if(!(amt>0))return toast('Enter purchase amount');let xp=Math.round(amt*data.vendor.xpPerDollar);data.vendor.available+=xp;data.vendor.lifetime+=xp;data.history.push({type:'purchase',amount:amt,xp});save();toast('+'+xp+' BHS XP awarded');render()}
if(data.vendorProfile===undefined)data.vendorProfile=null;save();render();
</script></body></html>
