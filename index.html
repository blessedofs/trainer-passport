<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer Passport Alpha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#091221;--card:#14223a;--soft:#213452;--text:#f7fbff;--muted:#a9bbd3;--gold:#ffd34d;--green:#72e0a5;--red:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#08101e,#112441);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px 16px 96px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:22px;margin:4px 0 14px}.mark{background:var(--gold);color:#111;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}.pill{display:inline-block;background:#273c5d;color:#d9e7fb;padding:6px 10px;border-radius:999px;font-size:12px}.card{background:#14223aee;border:1px solid #2b4164;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 14px 34px #0004}.hero{text-align:center;padding:28px 18px}.hero h1{font-size:31px;margin:5px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}h2,h3{margin:5px 0 10px}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin:6px 0;background:var(--gold);color:#171717;font-weight:850}.btn.secondary{background:#2b4164;color:white}.btn.ok{background:var(--green)}.btn.danger{background:var(--red)}label{display:block;margin:12px 0 5px;color:var(--muted)}input,select{width:100%;padding:13px;border:1px solid #3b557b;border-radius:12px;background:#0d192c;color:white;font:inherit}.row{display:flex;gap:9px}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--soft);padding:14px;border-radius:15px}.stat b{display:block;font-size:22px}.pokeArt{width:100px;height:100px;object-fit:contain}.starter{display:flex;align-items:center;gap:12px;padding:10px;background:#1b2d49;border:1px solid #38557e;border-radius:15px;margin:8px 0}.starter.selected{outline:2px solid var(--gold)}.starter img{width:70px;height:70px;object-fit:contain}.pokeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.poke{background:var(--soft);border-radius:16px;text-align:center;padding:10px}.poke img{width:100%;height:120px;object-fit:contain}.list{padding:12px 0;border-bottom:1px solid #2b4164}.nav{position:fixed;bottom:0;left:0;right:0;background:#08111ef2;border-top:1px solid #29405f}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.nav button{background:none;border:0;color:#b5c6dd;padding:8px;font-size:11px}.nav span{display:block;font-size:21px}.hidden{display:none!important}.toast{position:fixed;z-index:99;top:15px;left:50%;transform:translateX(-50%);background:white;color:#14223a;padding:12px 17px;border-radius:999px;font-weight:800;max-width:90%;text-align:center}.qr{background:white;color:#111;padding:18px;border-radius:16px;text-align:center;font-weight:900;word-break:break-all}.status{padding:10px 12px;border-radius:12px;background:#10213a;margin:8px 0}.good{border-left:4px solid var(--green)}.bad{border-left:4px solid var(--red)}
</style></head><body><div id="toast" class="toast hidden"></div><div class="wrap"><div class="brand"><div class="mark">TP</div>Trainer Passport <span class="pill">Alpha 0.5 • Supabase</span></div><main id="app"></main></div><div id="nav" class="nav hidden"><div class="navin"><button onclick="go('home')"><span>📕</span>Passport</button><button onclick="go('pokemon')"><span>🐾</span>Pokémon</button><button onclick="go('rewards')"><span>🎁</span>Rewards</button><button onclick="go('vendor')"><span>🏪</span>Vendor</button></div></div>
<script>
const SUPABASE_URL='https://slrfqduwpdhzrnvfqive.supabase.co';
const SUPABASE_KEY='sb_publishable_lZ2RGPChFdwx_056fd3uiW_UCNI_GzU';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const regions={Kanto:[['Bulbasaur',1],['Charmander',4],['Squirtle',7]],Johto:[['Chikorita',152],['Cyndaquil',155],['Totodile',158]],Hoenn:[['Treecko',252],['Torchic',255],['Mudkip',258]],Sinnoh:[['Turtwig',387],['Chimchar',390],['Piplup',393]],Unova:[['Snivy',495],['Tepig',498],['Oshawott',501]],Kalos:[['Chespin',650],['Fennekin',653],['Froakie',656]],Alola:[['Rowlet',722],['Litten',725],['Popplio',728]],Galar:[['Grookey',810],['Scorbunny',813],['Sobble',816]],Paldea:[['Sprigatito',906],['Fuecoco',909],['Quaxly',912]]};
const names={1:'Bulbasaur',4:'Charmander',7:'Squirtle',152:'Chikorita',155:'Cyndaquil',158:'Totodile',252:'Treecko',255:'Torchic',258:'Mudkip',387:'Turtwig',390:'Chimchar',393:'Piplup',495:'Snivy',498:'Tepig',501:'Oshawott',650:'Chespin',653:'Fennekin',656:'Froakie',722:'Rowlet',725:'Litten',728:'Popplio',810:'Grookey',813:'Scorbunny',816:'Sobble',906:'Sprigatito',909:'Fuecoco',912:'Quaxly',25:'Pikachu',54:'Psyduck',58:'Growlithe',92:'Gastly',104:'Cubone',123:'Scyther',131:'Lapras',133:'Eevee',143:'Snorlax',147:'Dratini'};
const art=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
let S={session:null,trainer:null,vendors:[],myVendor:null,pokemon:[],xp:[],events:[],eventVendors:[],rewards:[],history:[]},view='home';
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function go(v){view=v;render()}
async function boot(){const {data}=await sb.auth.getSession();S.session=data.session;if(S.session)await loadAll();render()}
async function loadAll(){let uid=S.session.user.id;const [tr,vs,pk,xp,ev,evv,rw,h]=await Promise.all([
 sb.from('trainers').select('*').eq('user_id',uid).maybeSingle(),sb.from('vendors').select('*'),sb.from('trainer_pokemon').select('*').eq('trainer_user_id',uid).order('unlocked_at'),sb.from('vendor_xp').select('*,vendors(business_name,slug)').eq('trainer_user_id',uid),sb.from('events').select('*').order('event_date',{ascending:false}),sb.from('event_vendors').select('*'),sb.from('rewards').select('*').eq('is_active',true),sb.from('xp_transactions').select('*,vendors(business_name)').eq('trainer_user_id',uid).order('created_at',{ascending:false}).limit(30)
 ]);let errs=[tr,vs,pk,xp,ev,evv,rw,h].map(x=>x.error).filter(Boolean);if(errs.length){console.error(errs);toast('Database needs the v0.5 patch first');}
 S.trainer=tr.data||null;S.vendors=vs.data||[];S.myVendor=S.vendors.find(v=>v.owner_user_id===uid)||null;S.pokemon=pk.data||[];S.xp=xp.data||[];S.events=ev.data||[];S.eventVendors=evv.data||[];S.rewards=rw.data||[];S.history=h.data||[];
}
function render(){let a=document.getElementById('app'),n=document.getElementById('nav');if(!S.session){n.classList.add('hidden');return authScreen(a)}if(!S.trainer){n.classList.add('hidden');return trainerSetup(a)}n.classList.remove('hidden');({home,pokemon,rewards,vendor}[view]||home)(a)}
function authScreen(a){a.innerHTML=`<section class="card hero"><div style="font-size:56px">📕⚡</div><h1>Trainer Passport</h1><p class="muted">Your events, vendor XP, rewards and Pokémon discoveries follow your account.</p></section><section class="card"><h2>Sign in</h2><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Password</label><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="signIn()">Sign In</button><button class="btn secondary" onclick="signUp()">Create Account</button><p class="tiny">New accounts may need to confirm their email before signing in.</p></section>`}
async function signUp(){let email=q('email'),password=q('pass');if(!email||password.length<6)return toast('Enter email and a password of at least 6 characters');let {data,error}=await sb.auth.signUp({email,password});if(error)return toast(error.message);if(data.session){S.session=data.session;await loadAll();render()}else toast('Account created. Check your email to confirm it, then sign in.')}
async function signIn(){let {data,error}=await sb.auth.signInWithPassword({email:q('email'),password:q('pass')});if(error)return toast(error.message);S.session=data.session;await loadAll();render()}
async function signOut(){await sb.auth.signOut();S={session:null,trainer:null,vendors:[],myVendor:null,pokemon:[],xp:[],events:[],eventVendors:[],rewards:[],history:[]};render()}
function q(id){return document.getElementById(id)?.value.trim()||''}
function trainerSetup(a){a.innerHTML=`<section class="card hero"><div style="font-size:52px">🧭</div><h1>Create Your Passport</h1><p class="muted">Choose your region and original partner.</p></section><section class="card"><label>Trainer name</label><input id="tname" maxlength="40"><label>Region</label><select id="region" onchange="drawStarters()">${Object.keys(regions).map(x=>`<option>${x}</option>`)}</select><div id="starters"></div><button class="btn" onclick="createTrainer()">Create Trainer Passport</button></section>`;drawStarters()}
function drawStarters(){let e=document.getElementById('starters'),r=q('region')||'Kanto';if(!e)return;e.innerHTML='<label>Choose your starter</label>'+regions[r].map((p,i)=>`<div class="starter ${i?'':'selected'}" data-id="${p[1]}" onclick="document.querySelectorAll('.starter').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"><img src="${art(p[1])}"><div><b>${p[0]}</b><div class="tiny">Original Partner</div></div></div>`).join('')}
async function createTrainer(){let name=q('tname'),region=q('region'),sel=document.querySelector('.starter.selected');if(!name||!sel)return toast('Choose a Trainer name and starter');let {error}=await sb.rpc('create_trainer_profile',{p_display_name:name,p_region:region,p_starter_dex:+sel.dataset.id});if(error)return toast(error.message);await loadAll();render();toast('Trainer Passport created!')}
function home(a){let eventCount=new Set(S.history.filter(x=>x.event_id).map(x=>x.event_id)).size,vendorCount=S.xp.length,totalXP=S.xp.reduce((s,x)=>s+x.available_xp,0),starter=S.trainer.starter_dex;a.innerHTML=`<section class="card"><div class="row"><div><span class="pill">TRAINER #${String(S.trainer.trainer_number).padStart(4,'0')}</span><h2>${S.trainer.display_name}'s Passport</h2></div><button class="btn secondary" onclick="signOut()">Sign Out</button></div><div class="row" style="align-items:center"><img class="pokeArt" src="${art(starter)}"><div><div class="tiny">ORIGINAL PARTNER</div><h3>${names[starter]||'Pokémon #'+starter}</h3><div class="muted">${S.trainer.region}</div></div></div><div class="grid"><div class="stat"><b>${eventCount}</b>Events Attended</div><div class="stat"><b>${vendorCount}</b>Vendors Discovered</div><div class="stat"><b>${S.pokemon.length}</b>Pokémon</div><div class="stat"><b>${totalXP}</b>Total Available XP</div></div></section><section class="card"><h3>⭐ My Vendors</h3>${S.xp.length?S.xp.map(x=>`<div class="list"><b>${x.vendors?.business_name||'Vendor'}</b><div>${x.available_xp} available • ${x.lifetime_xp} lifetime XP</div></div>`).join(''):'<p class="muted">Your vendor XP will appear after your first check-in.</p>'}</section>${history()}`}
function pokemon(a){a.innerHTML=`<section class="card"><h2>🐾 My Pokémon</h2><p class="muted">Permanent discoveries stored in your real Trainer Passport account.</p><div class="pokeGrid">${S.pokemon.map(p=>`<div class="poke"><img src="${art(p.pokemon_dex)}"><b>${names[p.pokemon_dex]||'Pokémon #'+p.pokemon_dex}</b><div class="tiny">${p.source_type==='starter'?'Original Partner':'Milestone Discovery'}</div></div>`).join('')}</div></section>`}
function rewards(a){let mine=S.rewards.filter(r=>S.xp.some(x=>x.vendor_id===r.vendor_id));a.innerHTML=`<section class="card"><h2>🎁 Rewards</h2>${mine.length?mine.map(r=>{let bal=S.xp.find(x=>x.vendor_id===r.vendor_id)?.available_xp||0;return `<div class="list"><b>${r.title}</b><div>${r.xp_cost} XP</div><div class="tiny">${bal>=r.xp_cost?'Available at vendor':'Need '+(r.xp_cost-bal)+' more XP'}</div></div>`}).join(''):'<p class="muted">Rewards from vendors you discover will appear here.</p>'}</section>`}
function vendor(a){if(!S.myVendor)return vendorSignup(a);let joined=S.eventVendors.filter(x=>x.vendor_id===S.myVendor.id).map(x=>S.events.find(e=>e.id===x.event_id)).filter(Boolean);a.innerHTML=`<section class="card"><h2>🏪 ${S.myVendor.business_name}</h2><span class="pill">VENDOR #${String(S.myVendor.vendor_number).padStart(4,'0')} • ACTIVE</span><p class="muted">Instant vendor account. No manual verification.</p></section><section class="card"><h3>📡 Permanent Checkpoint</h3><div class="qr">${location.origin+location.pathname+'?vendor='+S.myVendor.slug}</div><p class="tiny">Program this permanent URL into your NFC tag. A real scannable QR is the next polish step.</p></section><section class="card"><h3>📅 Create Event</h3><label>Name</label><input id="ename" placeholder="Project TCG"><label>Date</label><input id="edate" type="date"><label>Venue</label><input id="evenue" placeholder="Optional"><button class="btn" onclick="createEvent()">Create & Join Event</button><h3>Your Events</h3>${joined.length?joined.map(e=>`<div class="list"><b>${e.name}</b><div>${e.event_date}${e.venue?' • '+e.venue:''}</div><button class="btn ok" onclick="testCheckin('${e.id}')">Test My Trainer Check-In</button></div>`).join(''):'<p class="muted">No events joined yet.</p>'}</section><section class="card"><h3>⭐ XP Settings</h3><div class="grid"><div class="stat"><b>${S.myVendor.checkin_xp}</b>Check-in XP</div><div class="stat"><b>${S.myVendor.purchase_xp_per_dollar}</b>XP per $1</div></div><p class="tiny">Purchase scanning and reward redemption are connected server-side and will get their scanner UI next.</p></section>`}
function vendorSignup(a){a.innerHTML=`<section class="card hero"><div style="font-size:54px">🏪</div><h1>Become a Vendor</h1><p class="muted">Create your profile and activate immediately.</p></section><section class="card"><label>Business name</label><input id="biz"><label>Category</label><select id="cat"><option>Cards & Collectibles</option><option>Trading Cards</option><option>Accessories</option><option>3D Printed Collectibles</option><option>Other</option></select><label>Instagram</label><input id="ig" placeholder="Optional"><label>Website</label><input id="site" placeholder="Optional"><button class="btn" onclick="createVendor()">Activate Vendor Account</button></section>`}
async function createVendor(){let name=q('biz');if(!name)return toast('Enter a business name');let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Math.random().toString(36).slice(2,6);let {error}=await sb.from('vendors').insert({owner_user_id:S.session.user.id,business_name:name,slug,category:q('cat'),instagram:q('ig')||null,website:q('site')||null});if(error)return toast(error.message);await loadAll();render();toast('Vendor activated!')}
async function createEvent(){let name=q('ename'),date=q('edate');if(!name||!date)return toast('Add event name and date');let venue=q('evenue')||null;let {data:existing}=await sb.from('events').select('*').ilike('name',name).eq('event_date',date).limit(1);let event=existing?.[0];if(!event){let res=await sb.from('events').insert({created_by:S.session.user.id,name,event_date:date,venue}).select().single();if(res.error)return toast(res.error.message);event=res.data}let {error}=await sb.from('event_vendors').insert({event_id:event.id,vendor_id:S.myVendor.id});if(error&&error.code!=='23505')return toast(error.message);await loadAll();render();toast(existing?.length?'Joined existing event!':'Event created and joined!')}
async function testCheckin(eventId){let {data,error}=await sb.rpc('check_in',{p_vendor_id:S.myVendor.id,p_event_id:eventId});if(error)return toast(error.message);await loadAll();render();toast(data.already_checked_in?'Already checked in at this event':'+'+data.xp_awarded+' XP check-in!')}
function history(){return `<section class="card"><h3>⭐ XP History</h3>${S.history.length?S.history.map(h=>`<div class="list row"><div><b>${h.description||h.transaction_type}</b><div class="tiny">${h.vendors?.business_name||''} • ${new Date(h.created_at).toLocaleDateString()}</div></div><b>${h.amount>0?'+':''}${h.amount} XP</b></div>`).join(''):'<p class="muted">No XP activity yet.</p>'}</section>`}
sb.auth.onAuthStateChange(async(_,session)=>{S.session=session;if(session)await loadAll();render()});boot();
</script></body></html>
